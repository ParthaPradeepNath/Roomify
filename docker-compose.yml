services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roomify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomify}
      POSTGRES_DB: ${POSTGRES_DB:-roomify}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-roomify}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-roomify}:${POSTGRES_PASSWORD:-roomify}@db:5432/${POSTGRES_DB:-roomify}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-insecure-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-image-preview}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      UPLOAD_DIR: /app/server/uploads
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - api-uploads:/app/server/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_PUTER_WORKER_URL: ${VITE_PUTER_WORKER_URL:-}
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
  api-uploads:
